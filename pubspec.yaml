name: businesses_4_sale
description: Businesses 4 Sale — marketplace for listing and browsing businesses for sale.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.9
  firebase_core: ^3.14.0
  firebase_storage: ^12.4.7
  image_picker: ^1.1.2
  intl: ^0.20.2
  provider: ^6.1.5
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ads/
